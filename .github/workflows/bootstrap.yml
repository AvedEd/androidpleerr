name: Bootstrap
on: workflow_dispatch
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o androidpleerr.zip -d _e && shopt -s dotglob && cp _e/androidpleerr/.github/workflows/build.yml /tmp/build.yml.txt && rm -rf _e/androidpleerr/.github && cp -a _e/androidpleerr/. . && cp /tmp/build.yml.txt ./build.yml.txt && rm -rf _e androidpleerr.zip && git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -m bootstrap || true && git push
