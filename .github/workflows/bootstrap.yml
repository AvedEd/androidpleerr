name: Bootstrap
on:
  workflow_dispatch: {}
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o androidpleerr.zip -d _e && shopt -s dotglob && mv _e/androidpleerr/* . && rm -rf _e androidpleerr.zip && git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -m bootstrap || true && git push
